services:
  # Backend dependency sync
  backend-deps:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
    container_name: apex-flow-backend-deps
    volumes:
      - backend_node_modules:/tmp/sync
    command:
      ["sh", "-c", "cp -r /app/node_modules/* /tmp/sync/ 2>/dev/null || true"]

  # Frontend dependency sync
  frontend-deps:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
    container_name: apex-flow-frontend-deps
    volumes:
      - frontend_node_modules:/tmp/sync
    command:
      ["sh", "-c", "cp -r /app/node_modules/* /tmp/sync/ 2>/dev/null || true"]

  # PostgreSQL Database
  database:
    image: postgres:16-alpine3.22
    container_name: apex-flow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432" # local_port:container_port
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - apex-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
    container_name: apex-flow-backend
    command: ["./scripts/startup.sh", "bun", "--bun", "run", "dev"]
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=${BACKEND_PORT}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - CORS_ORIGIN=${CORS_ORIGIN}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - database
      - backend-deps
    networks:
      - apex-network
    restart: unless-stopped
    user: "${UID}:${GID}"

  # Frontend Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
    container_name: apex-flow-frontend
    command: ["bun", "--bun", "next", "dev"]
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PORT=${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
      - frontend-deps
    networks:
      - apex-network
    restart: unless-stopped
    user: "${UID}:${GID}"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:

networks:
  apex-network:
    driver: bridge

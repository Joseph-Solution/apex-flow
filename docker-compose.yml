# FILE LOCATION: /docker-compose.yml (at the root of your monorepo)
#
# This docker-compose file is optimized for team development.
# It uses the "Smart Sync" command to automatically run 'bun install'
# only when the lockfile has changed, making it fast and efficient.

services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine3.22
    container_name: apex-flow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - apex-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/dev/Dockerfile # Path to the shared Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
    container_name: apex-flow-backend
    command: >
      sh -c "
        if ! cmp -s bun.lockb node_modules/.install-lock.b 2>/dev/null; then
          echo 'Backend lockfile has changed, running bun install...' &&
          bun install &&
          if [ -f bun.lockb ]; then cp bun.lockb node_modules/.install-lock.b; fi;
        else
          echo 'Backend dependencies are up to date.';
        fi &&
        bun run dev
      "
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      - PORT=${BACKEND_PORT}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - CORS_ORIGIN=${CORS_ORIGIN}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - database
    networks:
      - apex-network
    restart: unless-stopped
    user: "${UID}:${GID}"

  # Frontend Next.js App
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/dev/Dockerfile # Path to the shared Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        UNAME: ${UNAME}
        GNAME: ${GNAME}
    container_name: apex-flow-frontend
    command: >
      sh -c "
        if ! cmp -s bun.lockb node_modules/.install-lock.b 2>/dev/null; then
          echo 'Frontend lockfile has changed, running bun install...' &&
          bun install &&
          if [ -f bun.lockb ]; then cp bun.lockb node_modules/.install-lock.b; fi;
        else
          echo 'Frontend dependencies are up to date.';
        fi &&
        bun run dev
      "
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PORT=${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    networks:
      - apex-network
    restart: unless-stopped
    user: "${UID}:${GID}"

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:

networks:
  apex-network:
    driver: bridge
